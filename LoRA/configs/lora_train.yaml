# SD3.5 LoRA training hyperparameters. Conservative defaults for NVIDIA T4 16GB.
base_model_id: stabilityai/stable-diffusion-3.5-medium
model_name: vinped_sd35m_lora_v1

resolution: 512
mixed_precision: fp16
train_batch_size: 1
gradient_accumulation_steps: 4
gradient_checkpointing: true
use_8bit_adam: true
train_text_encoder: false

rank: 8
lora_dropout: 0.05
learning_rate: 1.0e-4
lr_scheduler: constant
lr_warmup_steps: 0
max_train_steps: 1000
checkpointing_steps: 250
seed: 42

# Pinned Diffusers training script (vendored — see LoRA/vendor/diffusers/).
train_script: vendor/diffusers/v0.31.0/train_dreambooth_lora_sd3.py

image_column: image
caption_column: text
# Diffusers' script still requires --instance_prompt even in caption mode.
instance_prompt: "a photo of <vin_ped> pedestrian"
validation_prompt: "a photo of <vin_ped> pedestrian, full body, walking on an urban sidewalk"

pt_artifact_name: pytorch_lora_weights.pt
