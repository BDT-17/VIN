release_name: pedestrian_lora_v1

# Source datasets. Roles:
#   lora_candidate     -> eligible for the LoRA train/val release
#   inpaint_eval        -> frozen SD3.5 inpaint evaluation (never trains LoRA)
sources:
  - source_id: citypersons
    kaggle_mount: /kaggle/input/datasets/muttahirulislam/citypersons-dataset-with-bg-image/yolo_dir/yolo_dir
    parser: yolo
    source_type: pedestrian_detection
    group_strategy: original_scene
    duplicate_priority: 1
    # CityPersons train -> LoRA candidate; valid/test -> frozen inpaint eval.
    lora_splits: [train]
    eval_splits: [val]          # 'test' folder absent in the mounted dataset
    notes: >
      Canonical CityPersons. The train folder supplies LoRA candidates; the
      valid (and test, if present) folders are frozen for SD3.5 inpaint
      evaluation and must never enter LoRA training.
    splits:
      train: train/images
      val: valid/images
      test: test/images
    label_dirs:
      train: train/labels
      val: valid/labels
      test: test/labels

  - source_id: mot17_02
    kaggle_mount: /kaggle/input/datasets/kyoru4444/mot17-02-fcrnn
    parser: mot
    source_type: video_tracking
    group_strategy: sequence_time_window
    temporal_sampling_fps: 2.0
    temporal_window_seconds: 2.0
    duplicate_priority: 2
    lora_splits: [train]
    eval_splits: []
    notes: >
      MOT17-02 sequence frames. Temporal sampling avoids consecutive-frame
      redundancy; grouped by time window for split safety. LoRA candidate only.
    sequence_dir: MOT17-02-FRCNN/img1
    gt_dir: MOT17-02-FRCNN/gt

  - source_id: human_detection
    kaggle_mount: /kaggle/input/datasets/constantinwerner/human-detection-dataset/human detection dataset
    parser: classification_folders
    source_type: binary_classification
    positive_dir: "1"
    negative_dir: "0"
    group_strategy: perceptual_cluster
    duplicate_priority: 3
    lora_splits: [train]
    eval_splits: []
    notes: >
      Human Detection Dataset. Positive ("1") images require person detection /
      pseudo-labeling before becoming LoRA candidates. Negatives are ignored.

quality_thresholds:
  min_bbox_height_px: 96
  min_visible_ratio: 0.45
  min_quality_score: 0.70
  max_source_share: 0.50

split_config:
  # group-aware split of LoRA candidates into lora train/val
  train_ratio: 0.85
  val_ratio: 0.15
  split_seed: 42

eval_config:
  # how the frozen inpaint eval pool is partitioned (group-disjoint)
  eval_v1_ratio: 0.70          # dev/tuning set (inpaint_eval_v1)
  final_holdout_ratio: 0.30    # touch-once set (final_inpaint_test_v1)
  eval_seed: 42

caption_config:
  trigger_token: "<vin_ped>"
  class_token: pedestrian
  template_version: v1
  min_caption_tokens: 5
  max_caption_tokens: 77

export_config:
  format: imagefolder_jsonl
  crop_context_ratio: 0.25
  crop_min_size: 128
  crop_max_size: 768

base_model_id: stabilityai/stable-diffusion-3.5-medium
