# SD3.5 inpaint-EDIT LoRA training (learns: fill the mask to match the photo's
# vibe, from PIPE source/target pairs). Conservative defaults for an NVIDIA T4.
#
# Two trainable artifacts are produced and BOTH are required at inference:
#   adapter/pytorch_lora_weights.safetensors  (LoRA on attention)
#   adapter/input_adapter.pt                   (Conv 33->16 edit-conditioning)
base_model_id: stabilityai/stable-diffusion-3.5-medium
model_name: vinped_sd35m_edit_v1

resolution: 512
rank: 16                 # was 8 — stronger adapter (1000-step/rank-8 was too weak)
learning_rate: 1.0e-4
max_train_steps: 3000    # was 1000 — loss barely moved; needs more steps
checkpointing_steps: 500
seed: 42
grad_clip_norm: 1.0

# training fixes (2026-06-26): the 3000-step run had flat loss (0.27->0.27) and
# produced people that didn't fit the mask. Root cause was effective batch 1 and a
# loss that spent capacity on the soon-discarded background, not the conditioning
# (the spike PASSed at collapse_ratio 0.18, so the 33->16 conditioning IS wired).
grad_accum_steps: 16     # effective batch 16 (was 1) — fixes the noisy/flat loss
mask_loss_weight: 5.0    # weight in-mask error 5x: hard-restore discards out-of-mask,
                         # so the model should make the PERSON good, not the background

# data (PIPE train split, person-only, mask derived from |target-source|)
pipe_split: train
person_only: true
num_train_samples: 4000      # subsample of the 888k PIPE-train (T4-practical)
mask_diff_threshold: 25
mask_dilate_px: 6
min_mask_pixels: 64
shuffle_buffer: 2000

# flow-matching sampling (SD3 standard)
weighting_scheme: logit_normal   # logit_normal | mode | cosmap | none
logit_mean: 0.0
logit_std: 1.0

# memory: cache prompt embeddings to CPU after dropping text encoders
cache_embeds_cpu: true
