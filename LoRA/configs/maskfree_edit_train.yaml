# Mask-FREE SD3.5 edit training (IP2P/PIPE-style: add an object from the source
# image + instruction, NO mask, NO hard-restore). The model decides where/scale.
# Hyperparams adapted from the PIPE paper (Wasserman et al., 2404.18212) to a T4:
# paper used effective batch 4096 (128*8*4) on 8xA100; we lift batch=1 with
# grad-accumulation, keep lr 5e-5 and 5% CFG dropout.
#
# Two trainable artifacts, BOTH required at inference:
#   adapter/pytorch_lora_weights.safetensors  (LoRA on attention)
#   adapter/input_proj.pt                      (Conv 32->16, mask-free)
base_model_id: stabilityai/stable-diffusion-3.5-medium
model_name: vinped_sd35m_maskfree_v1

resolution: 512
rank: 16
learning_rate: 5.0e-5        # paper §F (was 1e-4 in the mask-based run)
max_train_steps: 4000
checkpointing_steps: 500
seed: 42
grad_clip_norm: 1.0

# IP2P-style training knobs
grad_accum_steps: 16         # effective batch 16 (paper: 4096; T4 can't match)
cfg_dropout_prob: 0.05       # drop text / image / both at p each (paper §4)

# data (PIPE person pairs; diff used only to drop no-op pairs, never fed to model)
pipe_split: train
person_only: true
num_train_samples: 4000
diff_thresh: 25
min_change_pixels: 64

# flow-matching sampling (SD3 standard)
weighting_scheme: logit_normal
logit_mean: 0.0
logit_std: 1.0
