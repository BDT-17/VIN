# SD3.5 inpaint evaluation: baseline (B0) vs LoRA (B1). Both conditions share
# every input below; the ONLY difference is the trigger token in the prompt.
base_model_id: stabilityai/stable-diffusion-3.5-medium

adapter_path: /kaggle/input/vinped-sd35m-lora-v1/pytorch_lora_weights.safetensors
adapter_name: vinped
adapter_weight: 0.70

resolution: 512
strength: 1.0
guidance_scale: 7.5
num_inference_steps: 30
seed_list: [42, 43, 44]

# Real golden eval set built from PIPE (target_img is a real photo -> a true
# ground truth, not another model's output). See build_eval_cases_pipe.py.
evaluation_release: /kaggle/working/vin_lora/eval/pipe_eval_v1

# PIPE eval-set builder settings
pipe_eval:
  split: test            # PIPE test == 752 rows
  person_only: true
  limit: null            # null = all matching person cases
  mask_diff_threshold: 25
  mask_dilate_px: 6

# Reproducibility guards — fail fast if the model/adapter do not match training.
require_base_model_match: true
require_adapter_sha256_match: false

# Metric thresholds (reporting only; no single fused score).
outside_mask_dilate_px: 8
person_detect_conf: 0.25
