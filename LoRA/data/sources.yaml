release_name: pedestrian_lora_v1

sources:
  - source_id: citypersons
    kaggle_mount: /kaggle/input/citypersons-canonical
    parser: yolo
    source_type: pedestrian_detection
    allowed_roles:
      - lora_positive
      - background
      - downstream_benchmark
    group_strategy: original_scene
    duplicate_priority: 1
    benchmark_lock: true
    license_review_required: true
    notes: >
      Canonical CityPersons source. Benchmark-locked samples must never
      enter LoRA training, prompt tuning, or synthetic generation.
    splits:
      train: train/images
      val: valid/images
      test: test/images
    label_dirs:
      train: train/labels
      val: valid/labels
      test: test/labels

  - source_id: mot17_02
    kaggle_mount: /kaggle/input/mot17-02-fcrnn
    parser: mot
    source_type: video_tracking
    allowed_roles:
      - lora_positive
      - background
    group_strategy: sequence_time_window
    temporal_sampling_fps: 2.0
    temporal_window_seconds: 2.0
    duplicate_priority: 2
    license_review_required: true
    notes: >
      MOT17-02 sequence frames. Use temporal sampling to avoid
      consecutive frame redundancy. Group by time window for split safety.
    sequence_dir: MOT17-02-FRCNN/img1
    gt_dir: MOT17-02-FRCNN/gt

  - source_id: human_detection
    kaggle_mount: /kaggle/input/human-detection-dataset
    parser: classification_folders
    source_type: binary_classification
    positive_dir: "1"
    negative_dir: "0"
    allowed_roles:
      - lora_positive
      - background
    group_strategy: perceptual_cluster
    duplicate_priority: 3
    license_review_required: true
    notes: >
      Human Detection Dataset. Positive images require person detection
      and pseudo-labeling before becoming LoRA training samples.
      Negative images are background pool only.

quality_thresholds:
  min_bbox_height_px: 96
  min_visible_ratio: 0.45
  min_quality_score: 0.70
  max_source_share: 0.50

split_config:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  split_seed: 42
  enforce_group_lock: true

caption_config:
  trigger_token: "<vin_ped>"
  template_version: "v1"
  min_caption_tokens: 5
  max_caption_tokens: 77

export_config:
  format: imagefolder_jsonl
  crop_context_ratio: 0.25
  crop_min_size: 128
  crop_max_size: 768
